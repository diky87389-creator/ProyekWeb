<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesanan Sukses - Warung Sayur Diky</title>
  <link rel="stylesheet" href="success.css" />
</head>
<body>
  <main class="success-page">
    <div class="success-card">
      <div class="success-mark">✓</div>
      <h1>Terima Kasih!</h1>
      <p class="success-intro">Pesanan Anda telah dicatat secara lokal. Silakan cek detail pesanan di bawah ini.</p>

      <section class="success-summary">
        <div class="summary-header">
          <div>
            <p class="eyebrow">Rangkuman Pesanan</p>
            <h2>Detail Pesanan</h2>
          </div>
          <div class="summary-meta">
            <span>Tanggal</span>
            <strong id="order-date">-</strong>
          </div>
        </div>

        <div class="summary-details">
          <div class="summary-row">
            <span>Metode Pengiriman</span>
            <strong id="order-delivery-method">-</strong>
          </div>
          <div class="summary-row">
            <span>Biaya Pengiriman</span>
            <strong id="order-shipping-cost">Rp0</strong>
          </div>
        </div>

        <div class="summary-items" id="success-items"></div>

        <div class="summary-footer">
          <div class="summary-row">
            <span>Subtotal Belanja</span>
            <strong id="success-subtotal">Rp0</strong>
          </div>
          <div class="summary-row">
            <span>Ongkir</span>
            <strong id="success-shipping">Rp0</strong>
          </div>
          <div class="summary-total-row">
            <span>Total Pembayaran</span>
            <strong id="success-total">Rp0</strong>
          </div>
        </div>
      </section>

      <div class="success-actions">
        <button class="button button-primary button-full" id="history-button" type="button">Lihat Riwayat Pesanan</button>
      </div>
    </div>
  </main>

  <script src="success.js"></script>
</body>
</html>
