<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://unpkg.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org; upgrade-insecure-requests">
  <title>Ubah Biodata - Warung Sayur Diky</title>
  <script src="session-gate.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="edit-profile.css" />
  <link rel="stylesheet" href="smart-guide-toast.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-width header-inner">
      <a class="brand" href="profile.html" aria-label="Kembali ke profil akun">
        <span class="brand-mark">WS</span>
        <span>
          <span class="brand-name">Warung Sayur Diky</span>
          <span class="brand-page">Ubah Biodata</span>
        </span>
      </a>
      <a class="back-link" href="profile.html">Kembali ke Profil</a>
    </div>
  </header>

  <main class="page-width page-main">
    <section class="edit-panel" aria-labelledby="page-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Pengaturan Akun</p>
          <h1 id="page-title">Ubah Biodata</h1>
          <p class="intro">Perbarui informasi akun dan alamat pengiriman Anda.</p>
        </div>
      </div>

      <form id="edit-profile-form" novalidate>
        <section class="form-section" aria-labelledby="identity-title">
          <h2 id="identity-title">Informasi Pribadi</h2>

          <div class="field-grid">
            <div class="field profile-edit-group">
              <label for="full-name">Nama Lengkap</label>
              <input id="full-name" name="fullName" type="text" autocomplete="name" maxlength="120" readonly aria-readonly="true" required />
              <div class="field-actions">
                <button id="save-full-name" class="button button-success" type="button" disabled>Simpan</button>
                <button id="edit-full-name" class="button button-secondary" type="button">Edit</button>
              </div>
            </div>
            <div class="field profile-edit-group">
              <label for="phone-number">Nomor Telepon</label>
              <input id="phone-number" name="phoneNumber" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" readonly aria-readonly="true" required />
              <div class="field-actions">
                <button id="save-phone-number" class="button button-success" type="button" disabled>Simpan</button>
                <button id="edit-phone-number" class="button button-secondary" type="button">Edit</button>
              </div>
            </div>
            <div class="field profile-edit-group">
              <label for="gender">Jenis Kelamin</label>
              <select id="gender" name="gender" disabled required>
                <option value="">Pilih jenis kelamin</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
              <div class="field-actions">
                <button id="save-gender" class="button button-success" type="button" disabled>Simpan</button>
                <button id="edit-gender" class="button button-secondary" type="button">Edit</button>
              </div>
            </div>
            <div class="field profile-edit-group">
              <label for="birth-date">Tanggal Lahir</label>
              <input id="birth-date" name="birthDate" type="date" readonly aria-readonly="true" required />
              <div class="field-actions">
                <button id="save-birth-date" class="button button-success" type="button" disabled>Simpan</button>
                <button id="edit-birth-date" class="button button-secondary" type="button">Edit</button>
              </div>
            </div>
          </div>

          <div class="field photo-field">
            <label for="profile-photo">Foto Profil</label>
            <div class="photo-control">
              <div class="avatar" id="photo-preview-wrap">
                <img id="photo-preview" alt="Pratinjau foto profil" hidden />
                <span id="photo-initials" aria-hidden="true">WS</span>
              </div>
              <div class="photo-actions">
                <input id="profile-photo" name="profilePhoto" type="file" accept="image/*" disabled />
                <div class="field-actions">
                  <button id="save-profile-photo" class="button button-success" type="button" disabled>Simpan</button>
                  <button id="edit-profile-photo" class="button button-secondary" type="button">Edit</button>
                  <button id="remove-photo" class="button button-quiet" type="button" disabled>Hapus Foto</button>
                </div>
                <p class="field-note">Format gambar, maksimal 5 MB.</p>
              </div>
            </div>
          </div>

          <div class="field-grid locked-fields">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" type="text" readonly aria-readonly="true" />
            </div>
            <div class="field">
              <label for="email-address">Email</label>
              <input id="email-address" type="email" readonly aria-readonly="true" />
            </div>
          </div>
        </section>

        <section class="form-section address-section" aria-labelledby="address-title">
          <h2 id="address-title">Alamat</h2>
          <div class="field">
            <label for="address">Alamat Lengkap (gabungan)</label>
            <textarea id="address" name="address" rows="3" readonly aria-readonly="true" placeholder="Alamat lengkap akan ditampilkan di sini"></textarea>
          </div>
          <div class="field">
            <label for="address-base">Alamat dari Lokasi</label>
            <textarea id="address-base" name="addressBase" rows="2" readonly aria-readonly="true" placeholder="Deteksi lokasi atau gunakan alamat yang tersimpan"></textarea>
            <button id="detect-location" class="button button-secondary" type="button">Gunakan Lokasi Terkini</button>
            <p id="address-coordinates" class="coordinate-note" aria-live="polite">Koordinat: belum tersimpan</p>
          </div>
          <div id="map" class="map" aria-label="Peta lokasi alamat"></div>
          <div class="field">
            <label for="address-detail">Detail Alamat Lengkap</label>
            <textarea id="address-detail" name="addressDetail" rows="3" maxlength="600" readonly aria-readonly="true" placeholder="Nama jalan, nomor rumah, RT/RW, kelurahan, kecamatan, kota, dan provinsi"></textarea>
            <div class="address-detail-actions">
              <button id="save-address-detail" class="button button-success" type="button" disabled>Simpan</button>
              <button id="edit-address-detail" class="button button-secondary" type="button">Edit</button>
            </div>
          </div>
          <input id="latitude" name="latitude" type="hidden" />
          <input id="longitude" name="longitude" type="hidden" />
        </section>

        <div class="form-actions">
          <a class="button button-quiet" href="profile.html">Batal</a>
          <button id="save-profile" class="button button-primary" type="submit">Simpan Perubahan</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="storage-helper.js"></script>
  <script src="edit-profile.js"></script>
  <script src="smart-guide-toast.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      SmartGuide.init();
    });
  </script>
</body>
</html>
