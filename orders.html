<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://accounts.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.tile.openstreetmap.org https://router.project-osrm.org; frame-src https://accounts.google.com; upgrade-insecure-requests">
  <title>Riwayat Pesanan - Warung Sayur Diky</title>
  <script src="session-gate.js"></script>
  <link rel="stylesheet" href="orders.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="smart-guide-toast.css" />
</head>
<body>
  <header class="orders-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-mark">WS</div>
        <div>
          <h1>Riwayat Pesanan</h1>
          <p>Lihat kembali pesanan Anda yang pernah dibuat sebelumnya.</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="button button-secondary" href="profile.html">Profil</a>
        <a class="button button-secondary" href="index.html">Kembali Belanja</a>
      </div>
    </div>
  </header>

  <main class="container orders-page">
    <section class="orders-panel">
      <div class="orders-actions">
        <h2>Daftar Transaksi</h2>
        <button class="button button-secondary" id="clear-history" type="button">Hapus Riwayat</button>
      </div>
      <div class="order-tabs" id="order-tabs" role="tablist" aria-label="Status pesanan"></div>
      <div class="orders-list" id="orders-list"></div>
    </section>
  </main>

  <footer class="orders-footer">
    <div class="container footer-text">
      <p>Data riwayat disimpan secara lokal di browser Anda.</p>
    </div>
  </footer>

  <script src="storage-helper.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="orders.js"></script>
  <script src="smart-guide-toast.js"></script>
</body>
</html>
