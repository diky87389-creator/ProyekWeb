<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Warung Sayur Diky</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">WS</div>
        <div>
          <h1>Masuk</h1>
          <p>Pilih cara masuk yang Anda inginkan untuk melanjutkan belanja.</p>
        </div>
      </div>

      <div class="auth-methods">
        <div class="auth-method">
          <p class="auth-method-title">Login</p>
          <form id="login-form" class="auth-form">
            <label for="login-email">Email</label>
            <input id="login-email" name="loginEmail" type="email" placeholder="contoh@email.com" autocomplete="email" required />

            <label for="login-password">Kata Sandi</label>
            <input id="login-password" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required />

            <button class="button button-primary" type="submit">Masuk</button>
          </form>
        </div>

        <div class="auth-divider" role="separator" aria-orientation="vertical"><span>atau</span></div>

        <div class="auth-method">
          <p class="auth-method-title">Sign up</p>
          <button id="google-login-button" class="button google-button" type="button">
            <span class="google-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="20" height="20" focusable="false">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 3-2.26 5.54-4.78 7.24l7.73 6c4.51-4.18 7.09-10.36 7.09-17.71z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
            </span>
            <span class="google-button-label">Masuk dengan Google</span>
          </button>
          <div id="google-native-button" class="google-native"></div>
        </div>
      </div>
    </section>

    <div class="toast" id="login-toast"></div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="login.js"></script>
</body>
</html>
